<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Meta tags por rota: em produção o nginx troca o bloco abaixo pelo trecho
      gerado em /api/seo/head (título, descrição, canonical, Open Graph, JSON-LD),
      para robôs e previews de link que não executam JavaScript. Em dev o bloco
      padrão aparece como está e o react-helmet-async ajusta no navegador.
    -->
    <!--# block name="seo_default" -->
    <title>Roupa de Domingo — camisetas engraçadas e estampas com humor ácido</title>
    <meta
      name="description"
      content="Camisetas engraçadas, moletons, canecas e garrafas com estampas de humor ácido. Produção própria e entrega para todo o Brasil."
    />
    <meta property="og:image" content="/og-default.png" />
    <!--# endblock -->
    <!--# include virtual="/__seo/head?path=$request_uri" stub="seo_default" -->
    <meta name="theme-color" content="#0f0f10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Olá. Você abriu o código-fonte de uma loja de camiseta.
      Isso diz mais sobre você do que qualquer estampa que vendemos.
      Existem 8 easter eggs. Este não é um deles.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Esta loja precisa de JavaScript. Assim como a sua autoestima precisa de validação externa.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
